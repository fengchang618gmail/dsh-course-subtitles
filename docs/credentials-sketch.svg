<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="'Segoe Print','Comic Sans MS','Kaiti SC','STKaiti','KaiTi','DFKai-SB',cursive">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <marker id="ah2" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.6,1.2 L8.4,5 L0.6,8.8" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="320" fill="#fffdf6"/>

  <g filter="url(#rough)" fill="none" stroke="#4a4a4a" stroke-width="2.2" stroke-linecap="round">
    <!-- three allowed sources -->
    <rect x="36" y="26"  width="252" height="58" rx="11" fill="#e8f1fe" transform="rotate(-0.7 162 55)"/>
    <rect x="36" y="108" width="252" height="58" rx="11" fill="#eaf7ec" transform="rotate(0.6 162 137)"/>
    <rect x="36" y="190" width="252" height="58" rx="11" fill="#fff6dd" transform="rotate(-0.6 162 219)"/>

    <!-- the reader -->
    <rect x="592" y="108" width="252" height="70" rx="12" fill="#f1eafe" transform="rotate(0.6 718 143)"/>

    <!-- arrows converging -->
    <path d="M292,55  C420,60  480,112 586,132" marker-end="url(#ah2)"/>
    <path d="M292,137 C400,137 480,139 586,141" marker-end="url(#ah2)"/>
    <path d="M292,219 C420,214 480,166 586,150" marker-end="url(#ah2)"/>

    <!-- the forbidden one -->
    <rect x="330" y="262" width="220" height="46" rx="10" fill="#fdecec" stroke="#b0392e" stroke-dasharray="7 5" transform="rotate(-0.5 440 285)"/>
    <path d="M338,267 L542,304 M542,267 L338,304" stroke="#b0392e" stroke-width="2.4"/>
  </g>

  <g text-anchor="middle" stroke="none">
    <text x="162" y="50"  font-size="15" fill="#333">环境变量</text>
    <text x="162" y="68"  font-size="11" fill="#777">如 FEISHU_APP_ID 等</text>

    <text x="162" y="132" font-size="15" fill="#333">本地配置文件</text>
    <text x="162" y="150" font-size="11" fill="#777">已在 .gitignore 里，不会提交</text>

    <text x="162" y="214" font-size="15" fill="#333">DSH 凭据库</text>
    <text x="162" y="232" font-size="11" fill="#777">~/.dsh/.credentials.yaml</text>

    <text x="718" y="136" font-size="16" fill="#333" transform="rotate(0.6 718 143)">插件运行时读取</text>
    <text x="718" y="156" font-size="12" fill="#5a4d80">密钥从不进仓库</text>

    <text x="440" y="290" font-size="14" fill="#b0392e" font-weight="bold">把密钥硬编码进代码 ❌</text>
  </g>
</svg>
